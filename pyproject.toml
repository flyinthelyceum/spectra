# The `spectra` package: measured reflectance of physical samples, and the models over them.
#   pip install -e .        (from a checkout)
[project]
name = "spectra"
version = "0.1.0"
description = "Measured reflectance of physical samples, and the models over them. Kubelka-Munk is the first."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The capture side only. The model and the library need nothing.
capture = ["pyserial>=3.5", "Pillow>=10.0"]
# The CAD spine. build123d 0.11.1 needs Python 3.13 — the system 3.14 has no OCP
# wheels — so build the venv with /opt/homebrew/bin/python3.13. `components` is
# the one writer for measured physical dimensions and is imported, never copied.
cad = [
  "build123d==0.11.1",
  "components @ git+https://github.com/flyinthelyceum/components.git@components-v1",
]
# Stage 1a hardware: an AS7341 sensor and a TLC59711 LED driver, read as plain
# Python through Blinka. Only installed on the Pi; `spectra/capture/hw.py` imports
# these lazily so the package still imports without them.
pi = [
  "adafruit-blinka>=9.2.0",
  "adafruit-circuitpython-as7341>=1.2.27",
  "adafruit-circuitpython-tlc59711>=2.0.20",
]

[project.urls]
Source = "https://github.com/flyinthelyceum/spectra"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spectra", "spectra.cad", "spectra.capture"]
