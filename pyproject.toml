# The `pigment` package: measured pigment spectra and the mixing model over them.
#   pip install -e .        (from a checkout)
[project]
name = "pigment"
version = "0.1.0"
description = "Measured spectral reflectance of artists' pigments, and the Kubelka-Munk model that predicts what they do in a mixture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The capture side only. The model and the library need nothing.
capture = ["pyserial>=3.5", "Pillow>=10.0"]

[project.urls]
Source = "https://github.com/flyinthelyceum/pigment"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pigment"]
