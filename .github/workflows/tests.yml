name: Tests

# Two suites with different costs, so they are two jobs.
#
# test_km.py is the Kubelka-Munk model. Pure Python, no dependencies, runs in
# seconds. It asserts properties a mixture must hold rather than numbers a
# previous run produced, so it fails when the model stops being physical.
#
# test_cad.py is the optical head geometry and the viewer. It needs the `cad`
# extra, which pulls build123d and roughly 150 MB of kernel. Same idea: it
# asserts the head is still a 45/0 instrument, not that the code still does what
# it did last time.
#
# Added 2026-09-18. Both suites were written and neither was being run by
# anything. This repo is public, so Actions minutes are free here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: Kubelka-Munk model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Model tests
        run: pytest -q tests/test_km.py

  cad:
    name: Optical head geometry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # build123d 0.11.1 has no OCP wheels for 3.14; pyproject says to build
          # the local venv with python3.13 for exactly this reason.
          python-version: "3.13"
          cache: pip

      - name: Install with the cad extra
        # `components` comes from the components-v1 TAG, so this reads the
        # measurements frozen at that tag rather than whatever main holds.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cad]" pytest

      - name: CAD tests
        run: pytest -q tests/test_cad.py
